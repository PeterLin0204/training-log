# 每天早上抓一次 Intervals.icu，產生「加密過的」網頁，直接部署到 GitHub Pages。
#
# 網頁不 commit 進 repo（docs/ 在 .gitignore 裡），只存在 Pages 上，而且是加密的——
# 公開 repo 裡看不到任何訓練或健康資料。
#
# 同時把純文字摘要推到私人 repo training-data，讓 Claude 能直接讀（網頁是加密的，Claude 讀不到）。
#
# 需要的 repo secrets（Settings → Secrets and variables → Actions）：
#   ICU_ATHLETE_ID、ICU_API_KEY、DIGEST_PASSWORD（網頁密碼）——在這個資料夾打 `gh secret set -f .env`
#   TRAINING_DATA_DEPLOY_KEY——推送 training-data 用的部署金鑰，只能寫那一個 repo

name: update digest

on:
  schedule:
    # 首頁「今日狀態」打開網頁時會即時抓，排程只負責更新週統計、趨勢、每日明細。
    # 台灣時間 06:17、09:17、21:17（UTC 22:17、01:17、13:17）。
    # 避開整點：GitHub 的排程在整點最塞，常常延遲甚至跳過。
    - cron: "17 22 * * *"
    - cron: "17 1 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:           # Actions 頁面可以手動按
  push:
    branches: [master]
    paths-ignore: ["**.md"]    # 改程式或 plan.json 就立刻重新發佈

permissions:
  contents: write              # 只用在下面的 keepalive 空 commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests cryptography

      - name: 產生加密網頁
        env:
          ICU_ATHLETE_ID: ${{ secrets.ICU_ATHLETE_ID }}
          ICU_API_KEY: ${{ secrets.ICU_API_KEY }}
          DIGEST_PASSWORD: ${{ secrets.DIGEST_PASSWORD }}
        # --encrypt：沒有密碼就直接失敗，絕不發佈明文
        run: python digest.py --weeks 8 --format html --encrypt --out site/index.html

      - name: 再確認一次是加密的
        run: grep -q '"enc":"aes-256-gcm"' site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 公開 repo 60 天沒有任何 commit，GitHub 會自動停用排程。
      # 網頁不 commit，所以每 50 天補一個空 commit 讓排程一直活著。
      - name: 保持排程不被停用
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "digest-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: 維持每日排程"
            git push
          fi

  # 文字摘要 → 私人 repo training-data。跟網頁分開跑：這一步失敗不影響網頁部署。
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 產生文字摘要並推到 training-data
        env:
          ICU_ATHLETE_ID: ${{ secrets.ICU_ATHLETE_ID }}
          ICU_API_KEY: ${{ secrets.ICU_API_KEY }}
          DEPLOY_KEY: ${{ secrets.TRAINING_DATA_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "沒有設定 TRAINING_DATA_DEPLOY_KEY，略過"; exit 0; fi
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          python digest.py --weeks 8 --out "$out/digest.txt"
          python digest.py --weeks 8 --format json --out "$out/digest.json"   # json 不含 API key
          cp plan.json .github/training-data/README.md "$out/"
          TZ=Asia/Taipei date '+%Y-%m-%d %H:%M（台灣時間）' > "$out/updated.txt"

          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --depth 1 git@github.com:PeterLin0204/training-data.git "$RUNNER_TEMP/repo"
          cp "$out"/* "$RUNNER_TEMP/repo/"
          cd "$RUNNER_TEMP/repo"
          git add -A
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git -c user.name="digest-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "摘要 $(TZ=Asia/Taipei date '+%F %H:%M')"
          git push -q
          echo "已更新 training-data"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
